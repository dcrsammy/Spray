<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your ticket · Spray</title><meta name="theme-color" content="#121a31">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  .ticket{background:var(--paper);color:var(--ink);border-radius:22px;padding:22px 20px 18px;text-align:center;margin-bottom:18px;position:relative;box-shadow:0 30px 60px -26px rgba(0,0,0,.9)}
  .ticket .holo{position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:multiply;opacity:.35;
    background:conic-gradient(from calc(var(--px,0)*90deg) at var(--gx,50%) var(--gy,30%),#ffd36e,#ff9ad5,#8fd3ff,#9dffb0,#ffd36e);mask:radial-gradient(circle at var(--gx,50%) var(--gy,30%),#000 0,transparent 70%);-webkit-mask:radial-gradient(circle at var(--gx,50%) var(--gy,30%),#000 0,transparent 70%)}
  .ticket .evn{font:400 1rem var(--display);color:#5b6480;margin-bottom:12px}
  .ticket .perf{position:relative;height:0;border-top:2px dashed #c9cfdf;margin:16px -20px 14px}
  .ticket .perf::before,.ticket .perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--night)}
  .ticket .perf::before{left:-10px}.ticket .perf::after{right:-10px}
  .ticket .qr{width:min(240px,70vw);padding:0}.ticket h3{color:var(--ink);font-size:1.3rem;margin:0 0 2px}
  .ticket .code{font:600 .9rem var(--mono);letter-spacing:.12em;color:#5b6480}
  .ticket.used{opacity:.6;filter:grayscale(.6)}.ticket .stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:3px solid #c43c35;color:#c43c35;font:600 1.6rem var(--mono);letter-spacing:.2em;padding:.2rem .8rem;border-radius:10px;z-index:2;background:rgba(238,240,246,.7)}
  .venue{border-left:3px solid var(--gold);padding-left:12px}
</style>
</head><body>
<div class="wrap">
  <header class="top"><a class="brand" href="/"><i>₦</i><span data-brand>Spray</span></a></header>
  <p class="muted" id="loading">Loading your ticket…</p>
  <main id="page" hidden>
    <p class="muted small">You're going to</p>
    <h1 id="name" style="font-size:clamp(1.7rem,7vw,2.4rem);margin-bottom:10px"></h1>
    <div class="card">
      <p><b id="date"></b></p>
      <div class="venue" style="margin-top:10px"><b id="venue"></b><p class="muted small" id="addr"></p><p class="small" id="secret" hidden style="color:var(--gold);margin-top:4px">🔒 Secret venue: please don't share it publicly.</p></div>
      <p class="muted small" style="margin-top:10px" id="who"></p>
    </div>
    <p class="muted small" style="margin:4px 0 12px">Show the QR code at the door. Each one can be scanned once. Screenshot this page in case the network is bad.</p>
    <div id="tickets"></div>
    <a class="btn gold" id="spray">Spray on the night 💸</a>
    <p class="muted small" style="margin-top:14px" id="paid"></p>
  </main>
</div>
<script src="/common.js"></script><script src="/alive.js"></script><script src="/qrcode.js"></script>
<script>
(async () => {
  let d;
  try { d = await api("/orders/" + codeFromPath()); } catch (x) { $("#loading").textContent = x.message; return; }
  const e = d.event; document.title = e.name + " · your ticket";
  $("#loading").hidden = true; $("#page").hidden = false;
  $("#name").textContent = e.name; $("#date").textContent = when(e.startsAt);
  $("#venue").textContent = e.venue || e.city || "Venue to be announced";
  $("#addr").textContent = [e.address, e.city].filter(Boolean).join(" · ");
  $("#secret").hidden = !e.venueHidden;
  $("#who").textContent = `${d.tickets.length} ticket${d.tickets.length === 1 ? "" : "s"} for ${d.order.name}`;
  for (const t of d.tickets) {
    const box = el("div", { class: "ticket tilt always", "data-tilt": "8" },
      el("span", { class: "holo" }),
      el("div", { class: "evn" }, e.name),
      el("div", { class: "qr" }),
      el("div", { class: "perf" }),
      el("h3", {}, t.type + (t.admits > 1 ? ` · admits ${t.admits}` : "")), el("div", { class: "code" }, t.code),
      t.checked_in ? el("span", { class: "stamp" }, "USED") : "");
    if (t.checked_in) box.classList.add("used");
    qr($(".qr", box), t.code); $("#tickets").append(box);
  }
  $("#spray").href = "/e/" + e.code;
  if (location.hash === "#new") { history.replaceState(null, "", location.pathname); setTimeout(() => burst(innerWidth / 2, innerHeight * .35, 34), 250); }
  $("#paid").textContent = d.order.subtotal ? `Paid ${naira(d.order.subtotal + d.order.fee)} (including ${naira(d.order.fee)} service fee).` : "Free RSVP.";
})();
</script>
</body></html>
